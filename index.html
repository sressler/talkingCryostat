<script>
(async () => {
  const status = document.getElementById('status');
  try {
    const canvas = document.getElementById('canvas');
    await customElements.whenDefined('x3d-canvas');
    const browser = canvas.browser;
    // Free trackball rotation in Examine mode (X_ITE clamps at the poles when this is on)
    browser.setBrowserOption('StraightenHorizon', false);
    const text = document.getElementById('world').textContent;
    const scene = await browser.createX3DFromString(text);
    await browser.replaceWorld(scene);
    browser.setBrowserOption('StraightenHorizon', false);
    const timer = scene.getNamedNode('MOUTH_TIMER');
    const sound = scene.getNamedNode('MOUTH_SOUND');
    const talk = document.getElementById('talk');
    talk.disabled = false;
    talk.onclick = () => {
      const t = Date.now() / 1000;
      timer.startTime = t;   // drives the mouth PositionInterpolator
      sound.startTime = t;   // plays cryo.wav
    };
    document.getElementById('front').onclick = () => browser.changeViewpoint('Front');
    document.getElementById('all').onclick = () => browser.viewAll(0.5);
    status.textContent = 'Click the mouth (or Talk) to hear the cryostat. Drag to rotate, scroll to zoom.';
  } catch (e) {
    console.error(e);
    status.textContent = 'Error loading world: ' + e;
  }
})();
</script>
